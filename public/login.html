<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · TH Terminal</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/account.css"></head><body class="account-page"><main class="card login-card"><div class="mark"></div><div class="kicker">TH TERMINAL</div><h1>Welcome back</h1><p class="notice">Sign in to access your markets and toolkit.</p><form id="login" class="form"><label class="fld"><span>Email</span><input name="email" type="email" autocomplete="username" required></label><label class="fld"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" required></label><label class="switch"><input id="showPassword" type="checkbox"><span></span>Show password</label><button class="btn gold" type="submit">Sign in</button><section id="testAccounts" class="test-accounts" aria-label="Testing accounts"><div class="test-accounts-title">Testing accounts</div><div id="testAccountButtons" class="test-account-buttons"><button type="button" class="test-account-button" disabled>Superadmin</button><button type="button" class="test-account-button" disabled>Full access</button><button type="button" class="test-account-button" disabled>Stocks only</button><button type="button" class="test-account-button" disabled>Crypto only</button></div><small id="testAccountHint">Choose an account to fill its credentials, then press Sign in.</small></section><p id="message" class="error" role="alert"></p></form></main><script type="module" src="/js/login.js?v=test-accounts-2"></script></body></html>
